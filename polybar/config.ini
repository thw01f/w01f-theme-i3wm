[colors]
background = #FF000000
dark-grey = #151515
grey = #666666
green = #FF0000
orange = #FF3333
blue = #FF0000
red = #FF0000
white = #FFFFFF

[bar/bar]
enable-ipc = true
height = 40
width = 100%
bottom = false
background = ${colors.background}
separator = "\\"

font-0 = JetBrainsMono Nerd Font:pixelsize=12;3
font-1 = JetBrainsMono Nerd Font:size=20;5

module-margin = 1
modules-left = workspaces
modules-center = time
modules-right = smart-ip cpu memory bluetooth  wlan power-profile pulseaudio battery tray

line-size = 3


[module/tray]
type = internal/tray

[module/empty-space]
type = custom/text
content = " "

[module/workspaces]
type = internal/xworkspaces

pin-workspaces = false
enable-click = true
enable-scroll = false

format = <label-state>
label-monitor = %name%

label-active = 
label-active-foreground = ${colors.red}
label-active-background = ${colors.dark-grey}
label-occupied = 
label-occupied-foreground = ${colors.white}
label-occupied-background = ${colors.background}
label-urgent = 
label-urgent-foreground = ${colors.red}
label-urgent-background = ${colors.background}
label-empty = 
label-empty-foreground = ${colors.grey}
label-empty-background = ${colors.background}

label-active-padding = 2
label-urgent-padding = 2
label-occupied-padding = 2
label-empty-padding = 2

[module/cpu]
type = internal/cpu
interval = 4
format-prefix = " " 
format = <label>
format-prefix-foreground = ${colors.red}
label = "%percentage%%"
label-padding = 0

[module/memory]
type = custom/script
exec = ~/.config/scripts/ram.sh
interval = 4
format-prefix = "RAM "
format-prefix-foreground = ${colors.red}
format-foreground = ${colors.white}

[module/wlan]
type = internal/network
interface = wlan0
interval = 2.0
click-left = ~/.config/scripts/wifi-menu.sh

format-connected = <label-connected>
format-connected-prefix = "NET "
format-connected-prefix-foreground = ${colors.red}
format-connected-padding = 0
label-connected = "%signal%% %essid%"

format-disconnected = <label-disconnected>
format-disconnected-prefix = "NET "
format-disconnected-prefix-foreground = ${colors.red}
format-disconnected-padding = 0
label-disconnected = "OFF"

[module/power-profile]
type = custom/script
exec = ~/.config/scripts/powerprofiles.sh
interval = 2
format-prefix = "PWR "
format-prefix-foreground = ${colors.red}
; Clicking opens a quick rofi selection menu for power modes (GNOME-like switcher popup)
click-left = ~/.config/scripts/powerprofiles.sh --menu

[module/smart-ip]
type = custom/script
exec = ~/.config/scripts/smart-ip.sh
interval = 10
format-foreground = ${colors.white}

[module/time]
type = internal/date
format-prefix-foreground = ${colors.red}
label = %date%, %time%
date = %a %d %B %y
time = %H:%M

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>
label-muted-foreground = ${colors.red}
label-muted = ﱝ Muted

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

ramp-volume-0-foreground = ${colors.red}
ramp-volume-1-foreground = ${colors.red}
ramp-volume-2-foreground = ${colors.red}

[module/battery]
type = internal/battery

low-at = 25
battery = BAT0
adapter = ADP0
poll-interval = 5

format-charging-prefix = "  "
format-charging-prefix-foreground = ${colors.green}
format-discharging-prefix = "  "
format-discharging-prefix-foreground = ${colors.red}
format-full-prefix = "  "
format-full-prefix-foreground = ${colors.red}
format-discharging-padding = 1
format-charging-padding = 1
format-full-padding = 1


[module/bluetooth]
type = custom/script
exec = ~/.config/scripts/bluetooth.sh
interval = 3
format-prefix = "BT "
format-prefix-foreground = ${colors.red}
click-left = ~/.config/scripts/bluetooth.sh --toggle


